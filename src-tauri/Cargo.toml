[package]
name = "media-downloader"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "media_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
store = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.3"
regex = "1.13.1"
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "cookies", "rustls", "stream"] }
tauri-plugin-autostart = "2.5.1"
tokio = { version = "1", features = ["process", "io-util", "fs", "time", "macros", "rt-multi-thread"] }
url = "2"
ed25519-dalek = "3.0.0"
sha2 = "0.11.0"
hex = "0.4.3"
base64 = "0.23.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
